<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #374151; stroke-opacity: 0.18; stroke-width: 1; }
    .stream-wave1 {
      fill: none;
      stroke: url(#streamGrad1);
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      animation: dashMove 12s linear infinite;
    }
    .stream-wave2 {
      fill: none;
      stroke: #a855f7;
      stroke-opacity: 0.4;
      stroke-width: 2;
      stroke-dasharray: 4 8;
      animation: dashMoveReverse 18s linear infinite;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite alternate;
    }
    .pulse-pill {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    @keyframes dashMoveReverse {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.9); opacity: 0.3; }
      50% { transform: translateY(-12px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(-24px) scale(0.9); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.8)); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Backdrop Circles -->
  <circle cx="150" cy="80" r="180" fill="url(#glowGrad)" />
  <circle cx="1050" cy="280" r="220" fill="url(#glowGrad)" />

  <!-- Dynamic / Animated Background Wave Streams (Behind text) -->
  <g opacity="0.65">
    <path class="stream-wave1" d="M -50 180 Q 250 80, 550 200 T 1250 170" />
    <path class="stream-wave2" d="M -50 220 Q 300 310, 650 160 T 1250 240" />
    <path class="stream-wave1" d="M -50 280 Q 400 130, 800 290 T 1250 130" opacity="0.4" />
  </g>

  <!-- Animated Floating Data Packets / Nodes (Behind foreground text) -->
  <g>
    <circle class="particle" cx="180" cy="270" r="4" fill="#38bdf8" style="animation-delay: 0s;" />
    <circle class="particle" cx="340" cy="80" r="3.5" fill="#818cf8" style="animation-delay: 1.5s;" />
    <circle class="particle" cx="890" cy="110" r="5" fill="#c084fc" style="animation-delay: 2.2s;" />
    <circle class="particle" cx="1020" cy="220" r="4" fill="#38bdf8" style="animation-delay: 3.5s;" />
    <circle class="particle" cx="720" cy="50" r="3" fill="#a78bfa" style="animation-delay: 0.8s;" />
    <circle class="particle" cx="120" cy="150" r="3" fill="#38bdf8" style="animation-delay: 2.7s;" />
  </g>

  <!-- Foreground Dynamic Metric Badges / Codec Pills -->
  <g transform="translate(0, 0)">
    <!-- Pill 1: Transcoding Engine -->
    <g class="pulse-pill" transform="translate(180, 48)">
      <rect width="180" height="34" rx="17" fill="#1f2937" stroke="#374151" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="35" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ENCODING PIPELINES</text>
    </g>

    <!-- Pill 2: HLS / DASH -->
    <g class="pulse-pill" transform="translate(840, 48)">
      <rect width="175" height="34" rx="17" fill="#1f2937" stroke="#374151" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="35" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">HLS • DASH • CMAF</text>
    </g>

    <!-- Pill 3: Codec Standards -->
    <g class="pulse-pill" transform="translate(500, 304)">
      <rect width="200" height="32" rx="16" fill="#111827" stroke="#374151" stroke-width="1.2" opacity="0.95" />
      <text x="100" y="21" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AV1 • HEVC • H.264 • VP9</text>
    </g>
  </g>

  <!-- Foreground Primary Header & Content (Clear, Crisp & Prominent) -->
  <g text-anchor="middle">
    <!-- Icon / Tagline Badge -->
    <g transform="translate(600, 105)">
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#312e81" stroke="#4338ca" stroke-width="1.2" />
      <text x="0" y="5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">🎬 MEDIA PROCESSING &amp; TRANSCODING</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Media Processing
    </text>

    <!-- Subtitle -->
    <text x="600" y="220" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500">
      Curated Cloud SaaS Platforms &amp; High-Performance Open-Source Pipelines
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="258" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      Video Encoding • Live Adaptive Streaming • Packaging &amp; DRM • Self-Hosted Toolchains
    </text>
  </g>

  <!-- Subtle Border Gradient -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#374151" stroke-width="1.5" opacity="0.4" />
</svg>
